<!DOCTYPE html>
<html lang="es">
<head>

<title>Baila Pro · Salsa y Bachata</title>
<style>
:root{--bg:#fff8f3;--card:#fff;--tx:#2a1a1a;--mut:#7a6561;--ac:#d6336c;--ac2:#f08c00;--bd:#f0ddd2;--ok:#2f9e44;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171012;--card:#241a1d;--tx:#f6ebe8;--mut:#b49c97;--ac:#ff6b9a;--ac2:#ffa94d;--bd:#3a2a2e;--ok:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171012;--card:#241a1d;--tx:#f6ebe8;--mut:#b49c97;--ac:#ff6b9a;--ac2:#ffa94d;--bd:#3a2a2e;--ok:#69db7c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto;padding:16px 14px 40px}
header h1{margin:0;font-size:24px;letter-spacing:-.3px}
header p{margin:2px 0 12px;color:var(--mut);font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.pct{font-size:12px;color:var(--mut);margin:4px 0 10px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:2px 0 8px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 3px;font-size:12px;line-height:1.15;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px}
nav button span{font-size:20px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.ai{width:100%;border:none;border-radius:12px;padding:13px;margin-bottom:9px;font-size:15.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer}
.vd{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--ac);text-decoration:none;border:1px solid var(--ac);border-radius:14px;padding:3px 10px}
.form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.form select,.form textarea{font:inherit;font-size:15px;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
.go{border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;background:var(--ac);color:#fff;cursor:pointer}
.go:disabled{opacity:.6}
.out{margin-top:12px;font-size:14.5px;overflow-wrap:anywhere}
.out h3{margin:14px 0 4px;font-size:16px;color:var(--ac)}
.out p{margin:4px 0}
.out li{margin:3px 0 3px 18px}
.intro{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.intro h2{margin:0 0 4px;font-size:19px}
.intro p{margin:0;color:var(--mut);font-size:14px}
.it{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer}
.it input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin-top:2px}
.it b{display:block;font-size:15.5px}
.it span{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.it.done{opacity:.6}
.it.done b{text-decoration:line-through}
.tip{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.tip b{display:block;margin-bottom:2px}
.rst{margin-top:18px;background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
.day{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:10px}.day h3{margin:0 0 4px;color:var(--ac);font-size:17px}.sec{font-weight:700;font-size:14px;margin:10px 0 2px}.sec em{font-style:normal;font-size:11px;background:var(--ac2);color:#fff;border-radius:8px;padding:1px 6px;margin-left:6px}.ex{display:flex;gap:8px;font-size:14px;margin:5px 0;align-items:flex-start}.ex input{width:20px;height:20px;accent-color:var(--ok);flex:none}.ex small{display:block;color:var(--mut);font-size:13px}.rest{margin-top:12px;font-size:13px;color:var(--mut)}.sm{margin-top:10px;width:100%;background:none;border:1px solid var(--ac);color:var(--ac);border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
.it span.rx,.ex .rx{display:block;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--ac2)}.day h3 small{color:var(--mut);font-weight:500;font-size:12.5px}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px)}
.ov[hidden]{display:none}
.ov .k{font-size:13px;font-weight:800;letter-spacing:2px;color:#fff;padding:5px 14px;border-radius:14px}
.ov .n{font-size:26px;font-weight:800}.ov .u{color:var(--mut);font-size:15px}
.ov .t{font-size:84px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin:8px 0}
.ov .pb{width:100%;max-width:420px;height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.ov .pb i{display:block;height:100%;background:var(--ac)}
.ov .x{font-size:13px;color:var(--mut)}
.ov .cs{display:flex;gap:8px;width:100%;max-width:420px;margin-top:10px}.ov .cs button{flex:1;padding:14px 4px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer}
.it.hm{margin-bottom:0;border-radius:12px 12px 0 0}.mo{background:var(--card);border:1px solid var(--bd);border-top:none;border-radius:0 0 12px 12px;padding:8px 12px;margin:0 0 9px;font-size:14px}.mo summary{cursor:pointer;color:var(--ac);font-weight:600}.mo div{white-space:pre-line;margin-top:6px}
.mo table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}.mo th,.mo td{border:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}.mo th{background:var(--bg)}
.mo.bx{border-top:1px solid var(--bd);border-radius:12px;margin:0 0 12px;padding:10px 12px}.mo.bx summary{font-weight:800;font-size:16px;color:var(--tx)}
button,.it,.mo summary,select{transition:background .15s,border-color .15s,color .15s,transform .15s,box-shadow .15s}
nav button:hover,nav button:focus-visible{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card));transform:translateY(-2px);box-shadow:0 4px 10px color-mix(in srgb,var(--ac) 25%,transparent)}
nav button.on,nav button.on:hover,nav button.on:focus-visible{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 45%,transparent)}
.it:hover,.ex:hover{border-color:var(--ac)}
.it:has(input:checked){border-color:var(--ok)}
.go:hover,.ai:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 40%,transparent)}
.sm:hover,.vd:hover,.ov .cs button:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.mo summary:hover{text-decoration:underline}
select:hover,select:focus{border-color:var(--ac);outline:none}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:active{transform:scale(.97)}
.vl{display:block;margin:12px 0 2px;font-size:15px;color:var(--ac)}.mo video{display:block;width:100%;max-width:300px;margin:6px auto;border-radius:10px;background:#000}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lang{display:flex;gap:4px}.lang button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer}.lang button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#stat{margin:0 0 10px;min-height:30px}.prm{display:inline-block;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:14px;padding:4px 12px;font-size:13px;font-weight:700}
.unl{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:14px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}.unl:hover{background:var(--ac);color:#fff}
nav button{position:relative}.lkm{position:absolute;top:3px;right:5px;font-size:11px;font-style:normal}
.note{background:color-mix(in srgb,var(--ac2) 14%,var(--card));border:1px solid var(--ac2);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.it.lk{opacity:.85;cursor:pointer;border-style:dashed;align-items:center}.it.lk .li{font-style:normal;font-size:20px;flex:none}.it.lk span{font-size:13px}
.lkr{cursor:pointer;color:var(--ac);font-weight:700}.lkr:hover{background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.mo.bx.lkr{border-radius:12px;margin-bottom:12px;padding:12px;font-size:16px}
.day.lkd{cursor:pointer;border-style:dashed}.mut{color:var(--mut);font-size:13px}
.um{justify-content:flex-start;overflow:auto;align-items:stretch;text-align:left;z-index:60}
.umi{max-width:460px;width:100%;margin:0 auto;position:relative;padding-top:6px}
.umi h2{margin:6px 40px 2px 0}.umi h3{margin:16px 0 2px;font-size:16px}.umi ul{padding-left:20px;margin:8px 0}.umi li{margin:4px 0}
.umx{position:absolute;right:0;top:0;background:var(--card);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;border:1px solid var(--bd)}
.pay{display:block;text-align:center;text-decoration:none;color:#fff;font-weight:700;border-radius:10px;padding:12px;margin:8px 0}.pay.mp{background:#009ee3}.pay.pp{background:#003087}.pay.hm{background:#f04e23}
.cl{display:grid;gap:4px;font-size:13px;color:var(--mut);margin:16px 0 8px}.cl input{font:inherit;font-size:16px;padding:11px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);text-transform:uppercase}
.msg{min-height:1.4em;font-weight:700;margin:8px 0}.msg.ok{color:var(--ok)}.msg.bad{color:#e03131}
.price{font-weight:800;font-size:17px;color:var(--ac)}
</style>
</head>

<script>
const L={"es":{"S":[{"n":"Resistencia","h":"Resistencia física","p":"Un show exige sostener intensidad alta durante varios minutos sin perder técnica.","t":"Entrená la resistencia con la música a un tempo más rápido que el de show: en escena todo se siente más liviano.","x":null,"i":[["Bloques de baile continuo","4 temas seguidos de 4–5 min sin parar. Descansá 90 s entre bloques. Subí un tema por semana."],["Cardio base","2–3 veces por semana, 30–40 min a ritmo conversable (trote, bici o remo) para mejorar la recuperación."],["Intervalos 30/30","30 s de footwork rápido a tope + 30 s de marcha suave, 10 rondas. Es el simulador de un pico de show."],["Rutina doble","Bailá tu coreografía completa dos veces seguidas. Si la segunda sale limpia, el show real te va a sobrar."],["Respiración en movimiento","Inhalá por la nariz en los pasos suaves y exhalá fuerte en saltos y giros. Evitá aguantar el aire."]],"xt":null},{"n":"Energía","h":"Energía física","p":"La energía se administra: cargas, gastás y recuperás con criterio.","t":"Si sentís la energía en 100% desde el primer compás, vas a llegar vacío al final. Guardate un pico para el cierre.","x":null,"i":[["Curva de intensidad","En coreografía, los picos y valles son la dinámica, intensidad y estructura visual o emocional de la pieza. No puede mantenerse siempre en el mismo nivel: necesita relieve.","🏔️ ¿Qué son los Picos?\n\nLos picos son los momentos de máxima intensidad, energía o clímax dentro de la coreografía.\n• En la energía: Movimientos explosivos, saltos, giros rápidos, acrobacias o secciones donde todo el grupo baila al unísono con mucha fuerza.\n• En lo visual: Formaciones expandidas, niveles altos (bailarines de pie o cargadas/lifts) y movimientos muy acentuados que capturan por completo la atención del público.\n• En la emoción: El punto de mayor tensión dramática o euforia de la historia que se está contando.\n\n🪵 ¿Qué son los Valles?\n\nLos valles son los momentos de calma, transición o baja intensidad que contrastan con los picos.\n• En la energía: Movimientos lentos, fluidos, sutiles o pausas dramáticas (silencios de movimiento).\n• En lo visual: Niveles bajos (bailarines en el suelo), formaciones agrupadas o compactas, o momentos donde solo un solista se mueve mientras el resto se mantiene estático.\n• En la emoción: Momentos de introspección, tristeza, vulnerabilidad o preparación antes de la siguiente gran sección.\n\n<b>¿Por qué son importantes en una coreografía?</b>\n<div style=\"overflow-x:auto\"><table><tr><th>Característica</th><th>Picos (Altos)</th><th>Valles (Bajos)</th></tr><tr><td>Función principal</td><td>Generar impacto, sorpresa y emoción.</td><td>Dar un «respiro» al espectador y al bailarín; construir tensión.</td></tr><tr><td>Niveles corporales</td><td>Saltos, cargadas, posiciones erguidas.</td><td>Trabajo de suelo, cuclillas, torsos inclinados.</td></tr><tr><td>Relación musical</td><td>Coinciden con el coro, el drop o acentos fuertes.</td><td>Coinciden con las estrofas, silencios o melodías suaves.</td></tr></table></div>\nEl secreto de una gran coreografía radica en el contraste. Sin los valles, los picos no se sentirían tan impactantes; y sin los picos, los valles harían que la coreografía se sintiera plana."],["Activación pre-escena","Ejercicios físicos, vocales y mentales justo antes de salir a escena, para conectar cuerpo, voz y emociones con lo que pide la escena.","🎭 Rutina de Activación en 4 Pasos\n\n1. Activación Física (Cuerpo)\n\nEl objetivo es liberar tensiones cotidianas y ganar presencia escénica.\n\n• Sacudida corporal: Comienza sacudiendo las manos, los brazos, las piernas y todo el cuerpo para soltar el estrés acumulado.\n\n• Estiramientos suaves: Rota los hombros, el cuello (en semicírculos) y la cadera para desbloquear las articulaciones.\n\n• Activación de la energía: Realiza saltos pequeños en el lugar o camina a diferentes ritmos (del 1 al 7) para elevar el ritmo cardíaco y el estado de alerta.\n\n2. Activación Vocal (Voz y Resonancia)\n\nPrepara el aparato fonador para proyectar sin lastimarse y mejorar la dicción.\n\n• Respiración diafragmática: Coloca una mano en el abdomen; inhala por la nariz inflando la panza y exhala lentamente con un sonido \"Sssss\".\n\n• Masaje facial: Masajea la mandíbula y las mejillas para relajar los músculos de la masticación.\n\n• Vocalización y resonadores: Emite el sonido \"Mmmmm\" (como imitando un motor) sintiendo la vibración en los labios, nariz y pecho. Luego, haz vibrar los labios (\"Brrrr\").\n\n• Articulación: Exagera la gesticulación repitiendo trabalenguas cortos o las vocales (A-E-I-O-U) abriendo mucho la boca.\n\n3. Activación Mental y Foco (Mente)\n\nAyuda a apagar el \"ruido del día\" y centrarse en el aquí y el ahora.\n\n• Punto fijo o vacío: Cierra los ojos durante un minuto, concéntrate únicamente en tu respiración y limpia tu mente de pensamientos ajenos a la obra.\n\n• Atención al entorno: Abre los ojos y observa tres objetos a tu alrededor en detalle para anclarte en el presente.\n\n4. Conexión con la Escena (Personaje)\n\nEl puente directo hacia la ficción que vas a habitar.\n\n• El \"motor\" del personaje: Camina por el espacio adoptando la postura corporal de tu personaje ( ¿Dónde lleva su peso?, ¿Cuál es su ritmo?).\n\n• Repaso del objetivo: Pregúntate justo antes de entrar: ¿Qué quiero lograr en esta escena? y ¿Qué acabo de hacer justo antes de este momento? (el antecedente inmediato)."],["Combustible","Para planificar tu alimentación de ensayo y show, usá una app de nutrición (por ejemplo MyFitnessPal o Cronometer) o consultá con un nutricionista deportivo."],["Hidratación","Usá una app de hidratación pensada para bailarines o deportistas (por ejemplo WaterMinder o Hydro Coach) para recordar y medir tu agua del día."],["Sueño y recuperación","7–9 h de sueño, un día de descanso real por semana y estiramiento suave después de ensayar."]],"xt":null},{"n":"Mentalidad","h":"Trabajos de mentalidad","p":"El cuerpo ejecuta lo que la cabeza le permite. Entrená la mente como entrenás las piernas.","t":"Los nervios y la emoción son la misma energía. Decile a tu cuerpo «estoy listo», no «estoy nervioso».","x":"Una rutina pre-escena es un conjunto de acciones físicas, mentales y vocales que realiza un actor justo antes de entrar a escena o filmar para estar completamente presente, disponible y conectado con la ficción. No existe una fórmula única, pero una estructura fija efectiva se divide en cuatro pilares secuenciales: cuerpo, voz, mente y conexión con el personaje.\n\nA continuación, tienes una rutina fija estructurada de 15 a 20 minutos que puedes adaptar a tus necesidades:\n\n<b>1. Preparación Física (Cuerpo) • 5 minutos</b>\nEl objetivo es liberar la tensión acumulada y activar la energía corporal.\n\n• <b>Estiramiento general:</b> Estira brazos, piernas y espalda (vértebra por vértebra) para eliminar la rigidez del día.\n• <b>Sacudida de tensión:</b> Sacude las manos, los pies y todo el cuerpo vigorosamente durante 30 segundos mientras exhalas con sonido.\n• <b>Anclaje:</b> Quédate quieto, con los pies paralelos a la altura de las caderas, sintiendo el peso del cuerpo hacia el suelo.\n\n<b>2. Activación Vocal (Voz) • 3 minutos</b>\nPrepara el aparato fonador para que la voz responda a cualquier exigencia emocional sin lastimarte.\n\n• <b>Respiración intercostal:</b> Coloca las manos en las costillas, inhala por la nariz expandiendo los costados y exhala lentamente con el sonido \"Sssss\".\n• <b>Masaje facial:</b> Masajea la mandíbula (zona de la ATM), las mejillas y la frente para relajar los músculos de la expresión.\n• <b>Vibración de labios:</b> Haz el sonido de un motor de coche con los labios (\"Brrrrr\") subiendo y bajando el tono (glissando).\n• <b>Articulación:</b> Di un trabalenguas corto o exagera la gesticulación de las vocales (A, E, I, O, U) sin emitir sonido.\n\n<b>3. Enfoque Mental (Mente) • 3 minutos</b>\nLimpia la mente de tus problemas personales y del ruido del \"backstage\".\n\n• <b>La regla del espacio:</b> Imagina un círculo a tu alrededor. Deja fuera de ese círculo todo lo que te haya pasado hoy (el tráfico, una discusión, el cansancio).\n• <b>Atención al entorno:</b> Nombra mentalmente 3 cosas que ves a tu alrededor y 3 sonidos que escuchas en este momento. Esto te trae al presente exacto.\n\n<b>4. Conexión con la Ficción (Personaje) • 4 minutos</b>\nEl paso final para entrar en la piel del personaje justo antes de que digan \"acción\" o salgas a escena.\n\n• <b>El monólogo interior:</b> Piensa qué estaba haciendo el personaje un minuto antes de que empiece la escena. ¿De dónde viene? ¿Qué acaba de pasarle?\n• <b>El objetivo inmediato:</b> Define en una sola frase qué quiere tu personaje en esta escena específica (ej: \"Quiero que me pida perdón\", \"Quiero convencerlo de que no se vaya\").\n• <b>La primera línea:</b> Repasa mentalmente (o susurrando) tu primera frase del texto y la última del actor que te da el pie.","i":[["Visualización diaria","5 min con ojos cerrados: ver y sentir tu show completo, con público, luces y sonido. Incluí un error y cómo lo resolvés."],["Rutina pre-escena fija","Siempre los mismos 5 pasos (respirar, movilidad, frase mental, ropa, entrada). La repetición da calma."],["Respiración 4–6","Inhalá 4 s, exhalá 6 s, durante 2 min antes de salir. Baja las pulsaciones y los nervios."],["Diálogo interno","Cambiá «no me puedo equivocar» por «confío en mi trabajo y disfruto». Escribí tu frase ancla."],["Ensayo con distracciones","Practicá con ruido, mirando gente o con la música cortada un instante. Te vuelve resiliente al imprevisto."],["Diario post-show","Anotá 3 aciertos, 1 aprendizaje y 1 objetivo. Mejora sin castigo."]],"xt":"Rutina pre-escena fija"},{"n":"Creación","h":"Trabajos de creación","p":"Para que tu baile tenga firma propia y no sea una suma de pasos.","t":"Crear no es inventar de cero: es mirar tu material con ojos nuevos.","x":null,"i":[["Restricción creativa","Improvisá 3 min usando solo 3 movimientos o solo un lado del cuerpo. Los límites despiertan ideas."],["Un tema, 5 lecturas","Bailá la misma canción siguiendo: clave, bajo, piano, voz y metales. Cada una cambia tu coreo."],["Banco de movimientos","Grabá 10 videos cortos por semana, guardá lo mejor y combinalos en frases nuevas de 8 tiempos."],["Historia en 3 actos","Definí inicio, conflicto y clímax. Elegí una emoción por acto y dejá que decida los pasos."],["Remix coreográfico","Tomá una coreo vieja y cambiale tempo, niveles, orden o rol de cada bailarín."],["Revisión en video","Mirá tu ensayo con sonido apagado: si se entiende la historia solo con el cuerpo, funciona."]],"xt":null},{"n":"Fuerza muscular","h":"Fuerza muscular y potencia en escena","p":"El estilo de baile se reconoce por la potencia, la velocidad de pies y la espectacularidad. Esto se construye con fuerza.","t":"Hacé fuerza 2–3 veces por semana y nunca el mismo día de un ensayo intenso de piernas. Respetá la técnica antes que el peso.","x":null,"i":[["Sentadilla con salto","4×8. Aterrizá suave y en silencio, con rodillas alineadas. Base de saltos, giros y cambios de nivel."],["Pliometría de cajón o escalón","3×6 saltos explosivos. Mejora la potencia para pasos rápidos, elevaciones y aterrizajes."],["Core potente","Plancha 3×45 s, hollow hold 3×20 s y rotaciones con peso liviano. El core une el cuerpo en los giros."],["Glúteos e isquios","Puente de glúteos, peso muerto rumano liviano y zancadas. Dan impulso y protegen la espalda."],["Tren superior para elevaciones","Flexiones, remo y fondos 3×10. Necesario para cargadas, apoyos y movimientos acrobáticos."],["Footwork veloz","60 s de pasos rápidos en el lugar a 200+ BPM, 5 rondas. Pies livianos, rodillas flexibles, torso quieto."],["Frenado de giros","Girá y clavá en un punto con el peso ya sobre un pie. La potencia está en frenar con control."]],"xt":null},{"n":"Técnica","h":"Trabajos técnicos","p":"La base técnica sostiene todo lo demás.","t":"Practicá lento y perfecto. La velocidad llega cuando la técnica es limpia.","x":null,"i":[["Giros y spot","Giros en una baldosa: 10 simples, 10 dobles, 10 triples. Foco fijo y cabeza que llega primero."],["Transferencia de peso","Caminá en cámara lenta 2 min por salón. El peso llega completo antes de mover el otro pie."],["Footwork salsa","Tap, Suzy-Q, cuban motion y rodillas flexibles. Practicá cada uno 2 min a distintas velocidades."],["Isolaciones","Cabeza, pecho, caderas y hombros por separado. Es la base de las olas de bachata y shines limpios."],["Bachata: caderas y olas","Cadera con círculos, ochos y rebotes. Ola corporal de rodillas a cabeza sin mover los pies."],["Conexión de pareja","Marcación con tono medio, ni rígido ni flojo. Trabajá tensión y compresión con tu partner, sin música."]],"xt":null},{"n":"Escenario","h":"Movilidad en el escenario","p":"Moverte bien por el espacio y tener un cuerpo móvil te da presencia y evita lesiones.","t":"Ensayá en el escenario real o en un espacio de las mismas medidas. La distancia cambia todo.","x":null,"i":[["Mapa del escenario","Dividí el espacio en 9 zonas. Asigná a cada frase de tu coreo una zona distinta para llenar todo el espacio."],["Diagonales y trayectorias","Las diagonales se ven más grandes. Alterná líneas, círculos y zigzag para dar dinamismo."],["Niveles","Alto, medio y bajo en cada tema. Un cambio de nivel justo en la frase clave genera impacto."],["Entradas y salidas","Ensayá solo la entrada y la salida 10 veces. Son lo primero y lo último que recuerda el público."],["Orientación al público","Abrí el pecho a la audiencia en los giros y las poses. Practicá con una cámara como público."],["Movilidad articular","Rutina diaria de 10 min: tobillos, caderas (círculos 90/90), columna (gato-camello), hombros y cuello."]],"xt":null},{"n":"Fuerza + elegancia","h":"Combinar fuerza energética y elegancia","p":"La potencia sin control es ruido. La elegancia sin energía es tibia. El arte está en el contraste.","t":"Fuerza que se siente en el suelo, elegancia que se ve en el aire.","x":null,"i":[["Fuerte abajo, suave arriba","Pies y piernas potentes, brazos y cuello largos y relajados. Practicá una frase así."],["Ataque y soltura","Golpeá el paso con intención (ataque) y soltá enseguida. Se ve poderoso sin rigidez."],["Misma coreo, dos intensidades","Bailá tu rutina al 100% y luego al 40% manteniendo toda la calidad. Descubrís dónde está la elegancia."],["Cuello largo, mirada alta","Imaginá un hilo que tira de la coronilla. Mantené la postura aun cuando las piernas trabajan al máximo."],["Pausa con tensión","Congelá 1 tiempo después de un movimiento fuerte, con el cuerpo vivo. Esa pausa es pura elegancia."],["Manos y líneas","Terminá cada movimiento hasta la punta de dedos y pies. Los detalles pulen la fuerza."]],"xt":null},{"n":"Matices","h":"Bailar con diferentes matices","p":"Un mismo paso puede contar cien cosas según cómo lo bailes.","t":"Los matices mantienen al público atento. Variá, aunque sea una pequeña diferencia, cada 8 tiempos.","x":null,"i":[["Rueda de calidades","Bailá 8 tiempos como: staccato (cortado), legato (fluido), pesado, ligero y vibrado. Rotá cada 30 s."],["Rueda de emociones","Alegría, nostalgia, seducción, enojo y humor sobre el mismo paso. Cambia tu cara y todo el cuerpo."],["Tamaño y velocidad","Hacé el movimiento grande, mediano y diminuto. Luego a doble y medio tiempo."],["Bachata: sensual, moderna y dominicana","Practicá cada versión con el mismo tema: sensual (cuerpo y ola), moderna (fluida y musical) y dominicana (pies y ritmo)."],["Salsa: ataque, juego y elegancia","Cambiá entre potencia, picardía y refinamiento sin cambiar los pasos."],["Escuchar la música","Cada 8 tiempos elegí un matiz distinto según lo que pida la canción: percusión fuerte, melodía suave o quiebre."]],"xt":null}],"ui":{"title":"Baila Pro · Salsa y Bachata","sub":"Entrenamiento para bailarines de salsa y bachata","done":"{d} de {t} ejercicios completados","planBtn":"📅 Crear mi plan semanal","tip":"💡 Tip pro","reset":"Reiniciar progreso","readMore":"Leer más","lockRead":"🔒 Leer más (Premium)","watch":"▶ Ver video","lockWatch":"🔒 Ver video (Premium)","sessSec":"▶ Iniciar sesión automática de esta sección","sessDay":"▶ Iniciar sesión automática","lockSess":"🔒 Sesión automática (Premium)","habit":"Hábito diario (no entra en la sesión automática)","sets":"sets","restw":"descanso","min":"min","s":"s","planT":"📅 Mi plan semanal","planI":"Incluye las 9 secciones, con sets y duraciones. Tocá «Iniciar sesión» y la app te guía sola hasta terminar.","daysL":"Días de entrenamiento por semana","goalL":"Énfasis de la semana","goals":{"bal":"Equilibrado","show":"Preparar un show","str":"Fuerza y potencia","end":"Resistencia y energía","ele":"Elegancia y matices"},"days":["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"],"approx":"~{m} min con calentamiento","restT":"😴 Descanso: {d}. Dormí bien y hacé movilidad suave.","vary":"🔀 Variar ejercicios","lockVary":"🔒 Variar ejercicios (Premium)","boost":"refuerzo","lockDay":"🔒 Desbloqueá Premium para ver este día y empezar la sesión guiada.","kWarm":"CALENTAMIENTO","kWork":"TRABAJO","kRest":"DESCANSO","kCool":"ESTIRAMIENTO","warmN":"Calentamiento","warmU":"Movilidad articular y activación","coolN":"Estiramiento","coolU":"Elongación suave y respiración lenta","restN":"Descanso","transN":"Transición","next":"Sigue: {x}","setOf":"Set {a} de {n}","step":"Paso {a} de {b}","pause":"⏸ Pausa","resume":"▶ Seguir","skip":"⏭ Saltar","exit":"✕ Salir","fin":"🎉 ¡Sesión completada!","finU":"Muy buen trabajo. Marcamos tus ejercicios como hechos.","close":"Cerrar","premium":"⭐ Premium activo","unlockBtn":"🔓 Desbloquear Premium","teaser":"🔒 Contenido Premium","secNote":"Esta sección es Premium. Probá un ejercicio de muestra y desbloqueá el resto.","uTitle":"Baila Pro Premium","uSub":"Desbloqueá todo el entrenamiento","uBen":["Secciones completas: Creación, Fuerza + elegancia, Matices, Escenario y Técnica","Todos los videos de Fuerza muscular","Sesión automática guiada con cronómetro, sets y descansos","Plan semanal completo (3 a 6 días, énfasis a elección y variantes)","Textos completos: Curva de intensidad, Activación y Rutina pre-escena"],"uHow":"Cómo obtenerlo","uNote":"Pagá con el medio que prefieras y recibí tu código de acceso. Pegalo abajo.","pMP":"Pagar con Mercado Pago (ARS)","pPP":"Pagar con PayPal (USD)","pHM":"Comprar en Hotmart","pNone":"Los medios de pago se habilitarán muy pronto.","price":"Precio: {x}","contact":"¿Dudas o ya pagaste y no recibiste el código?","codeL":"Tengo un código","act":"Activar","bad":"Código no válido. Revisalo e intentá de nuevo.","ok":"¡Listo! Premium activado 🎉","nocrypto":"Este navegador no puede validar códigos. Probá con otro.","vt":{"plank":"Plancha","torso":"Rotaciones de torso","hollow":"Hollow hold","lunge":"Zancadas","bridge":"Puente de glúteo","rdl":"Peso muerto rumano","row":"Remo","pushup":"Flexiones","dips":"Fondos"}}},"en":{"S":[{"n":"Endurance","h":"Physical endurance","p":"A show demands sustained high intensity for several minutes without losing technique.","t":"Train endurance with the music at a faster tempo than the show: on stage everything feels lighter.","x":null,"i":[["Continuous dance blocks","4 songs in a row of 4–5 min without stopping. Rest 90 s between blocks. Add one song each week."],["Base cardio","2–3 times a week, 30–40 min at a conversational pace (jog, bike or rowing) to improve recovery."],["30/30 intervals","30 s of all-out fast footwork + 30 s of easy marching, 10 rounds. It simulates a show peak."],["Double run-through","Dance your full choreography twice in a row. If the second one comes out clean, the real show will feel easy."],["Breathing in motion","Inhale through the nose on soft steps and exhale hard on jumps and turns. Avoid holding your breath."]]},{"n":"Energy","h":"Physical energy","p":"Energy is managed: you charge, spend and recover with purpose.","t":"If you feel your energy at 100% from the first beat, you'll arrive empty at the end. Save a peak for the finale.","x":null,"i":[["Intensity curve","In choreography, peaks and valleys are the dynamics, intensity and visual or emotional structure of the piece. It can't stay at the same level: it needs contour.","🏔️ What are Peaks?\n\nPeaks are the moments of maximum intensity, energy or climax within the choreography.\n• In energy: Explosive movements, jumps, fast turns, acrobatics or sections where the whole group dances in unison with great force.\n• Visually: Expanded formations, high levels (dancers standing or lifts) and strongly accented movements that fully capture the audience's attention.\n• In emotion: The point of greatest dramatic tension or euphoria in the story being told.\n\n🪵 What are Valleys?\n\nValleys are the moments of calm, transition or low intensity that contrast with the peaks.\n• In energy: Slow, fluid, subtle movements or dramatic pauses (silences in movement).\n• Visually: Low levels (dancers on the floor), grouped or compact formations, or moments where only one soloist moves while the rest stay still.\n• In emotion: Moments of introspection, sadness, vulnerability or preparation before the next big section.\n\n<b>Why are they important in a choreography?</b>\n<div style=\"overflow-x:auto\"><table><tr><th>Feature</th><th>Peaks (High)</th><th>Valleys (Low)</th></tr><tr><td>Main function</td><td>Create impact, surprise and emotion.</td><td>Give the audience and the dancer a “breather”; build tension.</td></tr><tr><td>Body levels</td><td>Jumps, lifts, upright positions.</td><td>Floor work, squats, leaning torsos.</td></tr><tr><td>Musical relation</td><td>They match the chorus, the drop or strong accents.</td><td>They match verses, silences or soft melodies.</td></tr></table></div>\nThe secret of a great choreography lies in contrast. Without valleys, peaks wouldn't feel so impactful; and without peaks, valleys would make the choreography feel flat."],["Pre-stage activation","Physical, vocal and mental exercises right before going on stage, to connect body, voice and emotions with what the scene asks for.","🎭 4-Step Activation Routine\n\n1. Physical Activation (Body)\n\nThe goal is to release everyday tension and gain stage presence.\n\n• Body shake: Start by shaking your hands, arms, legs and whole body to release accumulated stress.\n\n• Gentle stretches: Rotate your shoulders, neck (in semicircles) and hips to unlock the joints.\n\n• Energy activation: Do small jumps in place or walk at different rhythms (from 1 to 7) to raise your heart rate and alertness.\n\n2. Vocal Activation (Voice and Resonance)\n\nPrepare the vocal apparatus to project without hurting yourself and improve diction.\n\n• Diaphragmatic breathing: Place one hand on your abdomen; inhale through the nose inflating your belly and exhale slowly with an \"Sssss\" sound.\n\n• Facial massage: Massage your jaw and cheeks to relax the chewing muscles.\n\n• Vocalization and resonators: Make an \"Mmmmm\" sound (like imitating an engine) feeling the vibration in your lips, nose and chest. Then make your lips vibrate (\"Brrrr\").\n\n• Articulation: Exaggerate your gestures by repeating short tongue twisters or the vowels (A-E-I-O-U) opening your mouth wide.\n\n3. Mental Activation and Focus (Mind)\n\nHelps turn off the \"noise of the day\" and center yourself in the here and now.\n\n• Fixed point or void: Close your eyes for one minute, focus only on your breathing and clear your mind of thoughts unrelated to the piece.\n\n• Awareness of surroundings: Open your eyes and observe three objects around you in detail to anchor yourself in the present.\n\n4. Connection with the Scene (Character)\n\nThe direct bridge to the fiction you are about to inhabit.\n\n• The character's \"engine\": Walk through the space adopting your character's body posture (Where do they carry their weight? What is their rhythm?).\n\n• Reviewing the objective: Ask yourself right before entering: What do I want to achieve in this scene? and What did I just do right before this moment? (the immediate antecedent)."],["Fuel","To plan your rehearsal and show nutrition, use a nutrition app (for example MyFitnessPal or Cronometer) or consult a sports nutritionist."],["Hydration","Use a hydration app designed for dancers or athletes (for example WaterMinder or Hydro Coach) to remind you and track your daily water."],["Sleep and recovery","7–9 h of sleep, one real rest day per week and gentle stretching after rehearsing."]]},{"n":"Mindset","h":"Mindset training","p":"The body executes what the mind allows. Train your mind like you train your legs.","t":"Nerves and excitement are the same energy. Tell your body “I'm ready”, not “I'm nervous”.","x":"A pre-stage routine is a set of physical, mental and vocal actions an actor performs right before entering the stage or filming, to be fully present, available and connected with the fiction. There's no single formula, but an effective fixed structure is divided into four sequential pillars: body, voice, mind and connection with the character.\n\nBelow is a fixed routine of 15 to 20 minutes that you can adapt to your needs:\n\n<b>1. Physical Preparation (Body) • 5 minutes</b>\nThe goal is to release accumulated tension and activate body energy.\n\n• <b>General stretching:</b> Stretch arms, legs and back (vertebra by vertebra) to remove the stiffness of the day.\n• <b>Tension shake:</b> Shake your hands, feet and whole body vigorously for 30 seconds while exhaling with sound.\n• <b>Grounding:</b> Stand still, feet parallel at hip width, feeling the weight of your body toward the floor.\n\n<b>2. Vocal Activation (Voice) • 3 minutes</b>\nPrepare the vocal apparatus so your voice responds to any emotional demand without hurting you.\n\n• <b>Intercostal breathing:</b> Place your hands on your ribs, inhale through the nose expanding your sides and exhale slowly with the sound \"Sssss\".\n• <b>Facial massage:</b> Massage the jaw (TMJ area), cheeks and forehead to relax the expression muscles.\n• <b>Lip vibration:</b> Make the sound of a car engine with your lips (\"Brrrrr\") raising and lowering the pitch (glissando).\n• <b>Articulation:</b> Say a short tongue twister or exaggerate the gesture of the vowels (A, E, I, O, U) without making sound.\n\n<b>3. Mental Focus (Mind) • 3 minutes</b>\nClear your mind of personal problems and backstage \"noise\".\n\n• <b>The space rule:</b> Imagine a circle around you. Leave outside that circle everything that happened to you today (traffic, an argument, tiredness).\n• <b>Awareness of surroundings:</b> Mentally name 3 things you see around you and 3 sounds you hear right now. This brings you to the exact present.\n\n<b>4. Connection with the Fiction (Character) • 4 minutes</b>\nThe final step to get into the character's skin right before they say \"action\" or you go on stage.\n\n• <b>Inner monologue:</b> Think about what the character was doing a minute before the scene begins. Where do they come from? What just happened to them?\n• <b>The immediate objective:</b> Define in a single sentence what your character wants in this specific scene (e.g.: \"I want them to apologize\", \"I want to convince him not to leave\").\n• <b>The first line:</b> Review mentally (or whispering) your first line and the last line of the actor who gives you your cue.","xt":"Fixed pre-stage routine","i":[["Daily visualization","5 min with eyes closed: see and feel your whole show, with audience, lights and sound. Include a mistake and how you solve it."],["Fixed pre-stage routine","Always the same 5 steps (breathe, mobility, mental phrase, outfit, entrance). Repetition brings calm."],["4–6 breathing","Inhale 4 s, exhale 6 s, for 2 min before going out. It lowers your heart rate and nerves."],["Inner dialogue","Change “I can't make a mistake” to “I trust my work and I enjoy it”. Write down your anchor phrase."],["Rehearsing with distractions","Practice with noise, with people watching or with the music cut for a moment. It makes you resilient to the unexpected."],["Post-show journal","Write 3 wins, 1 lesson and 1 goal. Improvement without punishment."]]},{"n":"Creation","h":"Creative work","p":"So your dance has its own signature and isn't just a sum of steps.","t":"Creating isn't inventing from scratch: it's looking at your material with fresh eyes.","x":null,"i":[["Creative constraint","Improvise for 3 min using only 3 movements or only one side of the body. Limits wake up ideas."],["One song, 5 readings","Dance the same song following: clave, bass, piano, voice and horns. Each one changes your choreo."],["Movement bank","Record 10 short videos a week, keep the best and combine them into new 8-count phrases."],["Story in 3 acts","Define beginning, conflict and climax. Pick one emotion per act and let it decide the steps."],["Choreographic remix","Take an old choreo and change its tempo, levels, order or each dancer's role."],["Video review","Watch your rehearsal with the sound off: if the story is understood through the body alone, it works."]]},{"n":"Muscular strength","h":"Muscular strength and power on stage","p":"The dance style is recognized by its power, foot speed and spectacle. This is built with strength.","t":"Do strength work 2–3 times a week and never on the same day as an intense leg rehearsal. Respect technique before weight.","x":null,"i":[["Jump squat","4×8. Land softly and silently, knees aligned. The base for jumps, turns and level changes."],["Box or step plyometrics","3×6 explosive jumps. Improves power for fast steps, lifts and landings."],["Powerful core","Plank 3×45 s, hollow hold 3×20 s and rotations with light weight. The core ties the body together in turns."],["Glutes and hamstrings","Glute bridge, light Romanian deadlift and lunges. They give drive and protect the back."],["Upper body for lifts","Push-ups, rows and dips 3×10. Needed for lifts, support moves and acrobatic movements."],["Fast footwork","60 s of fast steps in place at 200+ BPM, 5 rounds. Light feet, soft knees, quiet torso."],["Turn braking","Spin and plant at a fixed point with your weight already on one foot. The power is in braking with control."]]},{"n":"Technique","h":"Technical work","p":"The technical base supports everything else.","t":"Practice slow and perfect. Speed comes when technique is clean.","x":null,"i":[["Turns and spotting","Turns on one floor tile: 10 singles, 10 doubles, 10 triples. Fixed focus and head arriving first."],["Weight transfer","Walk in slow motion for 2 min around the room. The weight arrives fully before moving the other foot."],["Salsa footwork","Tap, Suzy-Q, cuban motion and soft knees. Practice each one for 2 min at different speeds."],["Isolations","Head, chest, hips and shoulders separately. It's the base of bachata body waves and clean shines."],["Bachata: hips and waves","Hip circles, figure eights and bounces. Body wave from knees to head without moving the feet."],["Partner connection","Lead with medium tone, neither stiff nor loose. Work tension and compression with your partner, without music."]]},{"n":"Stage","h":"Stage mobility","p":"Moving well through space and having a mobile body gives you presence and prevents injuries.","t":"Rehearse on the real stage or in a space of the same size. Distance changes everything.","x":null,"i":[["Stage map","Divide the space into 9 zones. Assign each phrase of your choreo a different zone to fill the whole space."],["Diagonals and paths","Diagonals look bigger. Alternate lines, circles and zigzags for dynamism."],["Levels","High, middle and low in every song. A level change right on the key phrase creates impact."],["Entrances and exits","Rehearse just the entrance and exit 10 times. They are the first and last thing the audience remembers."],["Facing the audience","Open your chest to the audience in turns and poses. Practice with a camera as the audience."],["Joint mobility","Daily 10-min routine: ankles, hips (90/90 circles), spine (cat-camel), shoulders and neck."]]},{"n":"Strength + elegance","h":"Combining energetic strength and elegance","p":"Power without control is noise. Elegance without energy is lukewarm. The art is in the contrast.","t":"Strength you feel in the floor, elegance you see in the air.","x":null,"i":[["Strong below, soft above","Powerful feet and legs, long relaxed arms and neck. Practice a phrase like this."],["Attack and release","Hit the step with intention (attack) and release right away. It looks powerful without stiffness."],["Same choreo, two intensities","Dance your routine at 100% and then at 40% keeping all the quality. You discover where the elegance is."],["Long neck, high gaze","Imagine a string pulling from the crown of your head. Keep your posture even when your legs work at maximum."],["Pause with tension","Freeze for 1 beat after a strong movement, body still alive. That pause is pure elegance."],["Hands and lines","Finish every movement through your fingertips and toes. Details polish the strength."]]},{"n":"Nuances","h":"Dancing with different nuances","p":"The same step can tell a hundred stories depending on how you dance it.","t":"Nuances keep the audience engaged. Vary it, even slightly, every 8 counts.","x":null,"i":[["Quality wheel","Dance 8 counts as: staccato (cut), legato (flowing), heavy, light and vibrating. Rotate every 30 s."],["Emotion wheel","Joy, nostalgia, seduction, anger and humor on the same step. Your face and whole body change."],["Size and speed","Make the movement big, medium and tiny. Then at double and half time."],["Bachata: sensual, modern and dominican","Practice each version with the same song: sensual (body and wave), modern (fluid and musical) and dominican (feet and rhythm)."],["Salsa: attack, play and elegance","Switch between power, playfulness and refinement without changing the steps."],["Listening to the music","Every 8 counts choose a different nuance according to what the song asks: strong percussion, soft melody or a break."]]}],"ui":{"title":"Baila Pro · Salsa & Bachata","sub":"Training for salsa and bachata dancers","done":"{d} of {t} exercises completed","planBtn":"📅 Create my weekly plan","tip":"💡 Pro tip","reset":"Reset progress","readMore":"Read more","lockRead":"🔒 Read more (Premium)","watch":"▶ Watch video","lockWatch":"🔒 Watch video (Premium)","sessSec":"▶ Start automatic session for this section","sessDay":"▶ Start automatic session","lockSess":"🔒 Automatic session (Premium)","habit":"Daily habit (not part of the automatic session)","sets":"sets","restw":"rest","min":"min","s":"s","planT":"📅 My weekly plan","planI":"Includes all 9 sections, with sets and durations. Tap “Start session” and the app guides you until you finish.","daysL":"Training days per week","goalL":"Focus of the week","goals":{"bal":"Balanced","show":"Prepare a show","str":"Strength and power","end":"Endurance and energy","ele":"Elegance and nuances"},"days":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],"approx":"~{m} min including warm-up","restT":"😴 Rest: {d}. Sleep well and do gentle mobility.","vary":"🔀 Vary exercises","lockVary":"🔒 Vary exercises (Premium)","boost":"boost","lockDay":"🔒 Unlock Premium to see this day and start the guided session.","kWarm":"WARM-UP","kWork":"WORK","kRest":"REST","kCool":"COOL-DOWN","warmN":"Warm-up","warmU":"Joint mobility and activation","coolN":"Stretching","coolU":"Gentle stretching and slow breathing","restN":"Rest","transN":"Transition","next":"Next: {x}","setOf":"Set {a} of {n}","step":"Step {a} of {b}","pause":"⏸ Pause","resume":"▶ Resume","skip":"⏭ Skip","exit":"✕ Exit","fin":"🎉 Session complete!","finU":"Great job. We marked your exercises as done.","close":"Close","premium":"⭐ Premium active","unlockBtn":"🔓 Unlock Premium","teaser":"🔒 Premium content","secNote":"This section is Premium. Try one sample exercise and unlock the rest.","uTitle":"Baila Pro Premium","uSub":"Unlock the full training","uBen":["Full sections: Creation, Strength + elegance, Nuances, Stage and Technique","All Muscular strength videos","Guided automatic session with timer, sets and rests","Full weekly plan (3 to 6 days, your choice of focus, and variations)","Full texts: Intensity curve, Activation and Pre-stage routine"],"uHow":"How to get it","uNote":"Pay with the method you prefer and receive your access code. Paste it below.","pMP":"Pay with Mercado Pago (ARS)","pPP":"Pay with PayPal (USD)","pHM":"Buy on Hotmart","pNone":"Payment methods will be available very soon.","price":"Price: {x}","contact":"Questions, or paid and didn't get your code?","codeL":"I have a code","act":"Activate","bad":"Invalid code. Check it and try again.","ok":"Done! Premium activated 🎉","nocrypto":"This browser can't validate codes. Try another browser.","vt":{"plank":"Plank","torso":"Torso rotations","hollow":"Hollow hold","lunge":"Lunges","bridge":"Glute bridge","rdl":"Romanian deadlift","row":"Row","pushup":"Push-ups","dips":"Dips"}}},"pt":{"S":[{"n":"Resistência","h":"Resistência física","p":"Um show exige sustentar alta intensidade por vários minutos sem perder a técnica.","t":"Treine a resistência com a música em um tempo mais rápido que o do show: no palco tudo parece mais leve.","x":null,"i":[["Blocos de dança contínua","4 músicas seguidas de 4–5 min sem parar. Descanse 90 s entre blocos. Adicione uma música por semana."],["Cardio base","2–3 vezes por semana, 30–40 min em ritmo que permita conversar (corrida leve, bike ou remo) para melhorar a recuperação."],["Intervalos 30/30","30 s de footwork rápido no máximo + 30 s de marcha leve, 10 rodadas. É o simulador de um pico de show."],["Rotina dupla","Dance sua coreografia completa duas vezes seguidas. Se a segunda sair limpa, o show de verdade vai ser tranquilo."],["Respiração em movimento","Inspire pelo nariz nos passos suaves e expire forte nos saltos e giros. Evite prender o ar."]]},{"n":"Energia","h":"Energia física","p":"A energia se administra: você carrega, gasta e recupera com critério.","t":"Se você sente a energia em 100% desde o primeiro compasso, vai chegar vazio ao final. Guarde um pico para o encerramento.","x":null,"i":[["Curva de intensidade","Na coreografia, picos e vales são a dinâmica, a intensidade e a estrutura visual ou emocional da peça. Ela não pode ficar sempre no mesmo nível: precisa de relevo.","🏔️ O que são os Picos?\n\nOs picos são os momentos de máxima intensidade, energia ou clímax dentro da coreografia.\n• Na energia: Movimentos explosivos, saltos, giros rápidos, acrobacias ou seções em que todo o grupo dança em uníssono com muita força.\n• No visual: Formações expandidas, níveis altos (bailarinos em pé ou levantamentos/lifts) e movimentos muito acentuados que capturam por completo a atenção do público.\n• Na emoção: O ponto de maior tensão dramática ou euforia da história que está sendo contada.\n\n🪵 O que são os Vales?\n\nOs vales são os momentos de calma, transição ou baixa intensidade que contrastam com os picos.\n• Na energia: Movimentos lentos, fluidos, sutis ou pausas dramáticas (silêncios de movimento).\n• No visual: Níveis baixos (bailarinos no chão), formações agrupadas ou compactas, ou momentos em que só um solista se move enquanto o resto fica parado.\n• Na emoção: Momentos de introspecção, tristeza, vulnerabilidade ou preparação antes da próxima grande seção.\n\n<b>Por que são importantes em uma coreografia?</b>\n<div style=\"overflow-x:auto\"><table><tr><th>Característica</th><th>Picos (Altos)</th><th>Vales (Baixos)</th></tr><tr><td>Função principal</td><td>Gerar impacto, surpresa e emoção.</td><td>Dar um “respiro” ao espectador e ao bailarino; construir tensão.</td></tr><tr><td>Níveis corporais</td><td>Saltos, levantamentos, posições eretas.</td><td>Trabalho de chão, agachamentos, troncos inclinados.</td></tr><tr><td>Relação musical</td><td>Coincidem com o refrão, o drop ou acentos fortes.</td><td>Coincidem com as estrofes, silêncios ou melodias suaves.</td></tr></table></div>\nO segredo de uma grande coreografia está no contraste. Sem os vales, os picos não seriam tão impactantes; e sem os picos, os vales deixariam a coreografia sem relevo."],["Ativação pré-cena","Exercícios físicos, vocais e mentais logo antes de entrar em cena, para conectar corpo, voz e emoções com o que a cena pede.","🎭 Rotina de Ativação em 4 Passos\n\n1. Ativação Física (Corpo)\n\nO objetivo é liberar as tensões do dia a dia e ganhar presença cênica.\n\n• Sacudida corporal: Comece sacudindo as mãos, os braços, as pernas e o corpo todo para soltar o estresse acumulado.\n\n• Alongamentos suaves: Gire os ombros, o pescoço (em semicírculos) e o quadril para destravar as articulações.\n\n• Ativação da energia: Faça pequenos saltos no lugar ou caminhe em diferentes ritmos (de 1 a 7) para elevar a frequência cardíaca e o estado de alerta.\n\n2. Ativação Vocal (Voz e Ressonância)\n\nPrepare o aparelho fonador para projetar sem se machucar e melhorar a dicção.\n\n• Respiração diafragmática: Coloque uma mão no abdômen; inspire pelo nariz inflando a barriga e expire lentamente com um som \"Sssss\".\n\n• Massagem facial: Massageie a mandíbula e as bochechas para relaxar os músculos da mastigação.\n\n• Vocalização e ressonadores: Emita o som \"Mmmmm\" (como imitando um motor) sentindo a vibração nos lábios, no nariz e no peito. Depois, faça os lábios vibrarem (\"Brrrr\").\n\n• Articulação: Exagere a gesticulação repetindo trava-línguas curtos ou as vogais (A-E-I-O-U) abrindo bem a boca.\n\n3. Ativação Mental e Foco (Mente)\n\nAjuda a desligar o \"ruído do dia\" e centrar-se no aqui e agora.\n\n• Ponto fixo ou vazio: Feche os olhos por um minuto, concentre-se apenas na respiração e limpe a mente de pensamentos alheios à peça.\n\n• Atenção ao entorno: Abra os olhos e observe três objetos ao seu redor em detalhe para se ancorar no presente.\n\n4. Conexão com a Cena (Personagem)\n\nA ponte direta para a ficção que você vai habitar.\n\n• O \"motor\" do personagem: Caminhe pelo espaço adotando a postura corporal do seu personagem (Onde ele carrega o peso? Qual é o seu ritmo?).\n\n• Revisão do objetivo: Pergunte-se logo antes de entrar: O que eu quero conseguir nesta cena? e O que acabei de fazer logo antes deste momento? (o antecedente imediato)."],["Combustível","Para planejar sua alimentação de ensaio e show, use um app de nutrição (por exemplo MyFitnessPal ou Cronometer) ou consulte um nutricionista esportivo."],["Hidratação","Use um app de hidratação pensado para bailarinos ou atletas (por exemplo WaterMinder ou Hydro Coach) para lembrar e medir sua água do dia."],["Sono e recuperação","7–9 h de sono, um dia de descanso de verdade por semana e alongamento suave depois de ensaiar."]]},{"n":"Mentalidade","h":"Trabalhos de mentalidade","p":"O corpo executa o que a mente permite. Treine a mente como treina as pernas.","t":"O nervosismo e a emoção são a mesma energia. Diga ao seu corpo “estou pronto”, não “estou nervoso”.","x":"Uma rotina pré-cena é um conjunto de ações físicas, mentais e vocais que um ator realiza logo antes de entrar em cena ou filmar para estar completamente presente, disponível e conectado com a ficção. Não existe uma fórmula única, mas uma estrutura fixa eficaz se divide em quatro pilares sequenciais: corpo, voz, mente e conexão com o personagem.\n\nA seguir, uma rotina fixa estruturada de 15 a 20 minutos que você pode adaptar às suas necessidades:\n\n<b>1. Preparação Física (Corpo) • 5 minutos</b>\nO objetivo é liberar a tensão acumulada e ativar a energia corporal.\n\n• <b>Alongamento geral:</b> Alongue braços, pernas e costas (vértebra por vértebra) para eliminar a rigidez do dia.\n• <b>Sacudida de tensão:</b> Sacuda as mãos, os pés e o corpo todo vigorosamente por 30 segundos enquanto expira com som.\n• <b>Ancoragem:</b> Fique parado, com os pés paralelos na largura dos quadris, sentindo o peso do corpo em direção ao chão.\n\n<b>2. Ativação Vocal (Voz) • 3 minutos</b>\nPrepare o aparelho fonador para que a voz responda a qualquer exigência emocional sem se machucar.\n\n• <b>Respiração intercostal:</b> Coloque as mãos nas costelas, inspire pelo nariz expandindo as laterais e expire lentamente com o som \"Sssss\".\n• <b>Massagem facial:</b> Massageie a mandíbula (região da ATM), as bochechas e a testa para relaxar os músculos da expressão.\n• <b>Vibração de lábios:</b> Faça o som de um motor de carro com os lábios (\"Brrrrr\") subindo e descendo o tom (glissando).\n• <b>Articulação:</b> Diga um trava-língua curto ou exagere a gesticulação das vogais (A, E, I, O, U) sem emitir som.\n\n<b>3. Foco Mental (Mente) • 3 minutos</b>\nLimpe a mente dos seus problemas pessoais e do \"ruído\" do backstage.\n\n• <b>A regra do espaço:</b> Imagine um círculo ao seu redor. Deixe fora desse círculo tudo o que aconteceu com você hoje (o trânsito, uma discussão, o cansaço).\n• <b>Atenção ao entorno:</b> Nomeie mentalmente 3 coisas que você vê ao seu redor e 3 sons que escuta neste momento. Isso traz você ao presente exato.\n\n<b>4. Conexão com a Ficção (Personagem) • 4 minutos</b>\nO passo final para entrar na pele do personagem logo antes de dizerem \"ação\" ou de você entrar em cena.\n\n• <b>O monólogo interior:</b> Pense no que o personagem estava fazendo um minuto antes de a cena começar. De onde ele vem? O que acabou de acontecer com ele?\n• <b>O objetivo imediato:</b> Defina em uma única frase o que seu personagem quer nesta cena específica (ex.: \"Quero que ele me peça desculpas\", \"Quero convencê-lo a não ir embora\").\n• <b>A primeira fala:</b> Revise mentalmente (ou sussurrando) sua primeira frase do texto e a última do ator que lhe dá a deixa.","xt":"Rotina pré-cena fixa","i":[["Visualização diária","5 min de olhos fechados: ver e sentir seu show completo, com público, luzes e som. Inclua um erro e como você o resolve."],["Rotina pré-cena fixa","Sempre os mesmos 5 passos (respirar, mobilidade, frase mental, figurino, entrada). A repetição traz calma."],["Respiração 4–6","Inspire 4 s, expire 6 s, durante 2 min antes de entrar. Baixa os batimentos e o nervosismo."],["Diálogo interno","Troque “não posso errar” por “confio no meu trabalho e curto o momento”. Escreva sua frase âncora."],["Ensaio com distrações","Pratique com barulho, com gente olhando ou com a música cortada por um instante. Deixa você resiliente ao imprevisto."],["Diário pós-show","Anote 3 acertos, 1 aprendizado e 1 objetivo. Evolução sem punição."]]},{"n":"Criação","h":"Trabalhos de criação","p":"Para que sua dança tenha assinatura própria e não seja uma soma de passos.","t":"Criar não é inventar do zero: é olhar para o seu material com olhos novos.","x":null,"i":[["Restrição criativa","Improvise 3 min usando só 3 movimentos ou só um lado do corpo. Os limites despertam ideias."],["Uma música, 5 leituras","Dance a mesma música seguindo: clave, baixo, piano, voz e metais. Cada uma muda sua coreo."],["Banco de movimentos","Grave 10 vídeos curtos por semana, guarde o melhor e combine em frases novas de 8 tempos."],["História em 3 atos","Defina início, conflito e clímax. Escolha uma emoção por ato e deixe que ela decida os passos."],["Remix coreográfico","Pegue uma coreo antiga e mude o tempo, os níveis, a ordem ou o papel de cada bailarino."],["Revisão em vídeo","Veja seu ensaio com o som desligado: se a história se entende só com o corpo, funciona."]]},{"n":"Força muscular","h":"Força muscular e potência em cena","p":"O estilo de dança se reconhece pela potência, pela velocidade dos pés e pelo espetáculo. Isso se constrói com força.","t":"Faça treino de força 2–3 vezes por semana e nunca no mesmo dia de um ensaio intenso de pernas. Respeite a técnica antes da carga.","x":null,"i":[["Agachamento com salto","4×8. Aterrisse suave e em silêncio, com os joelhos alinhados. Base de saltos, giros e mudanças de nível."],["Pliometria no caixote ou degrau","3×6 saltos explosivos. Melhora a potência para passos rápidos, elevações e aterrissagens."],["Core potente","Prancha 3×45 s, hollow hold 3×20 s e rotações com peso leve. O core une o corpo nos giros."],["Glúteos e posteriores","Ponte de glúteos, levantamento terra romeno leve e afundos. Dão impulso e protegem as costas."],["Parte superior para elevações","Flexões, remada e mergulhos 3×10. Necessário para levantamentos, apoios e movimentos acrobáticos."],["Footwork veloz","60 s de passos rápidos no lugar a 200+ BPM, 5 rodadas. Pés leves, joelhos flexíveis, tronco quieto."],["Frenagem de giros","Gire e finque em um ponto com o peso já sobre um pé. A potência está em frear com controle."]]},{"n":"Técnica","h":"Trabalhos técnicos","p":"A base técnica sustenta todo o resto.","t":"Pratique devagar e perfeito. A velocidade vem quando a técnica está limpa.","x":null,"i":[["Giros e spot","Giros em um ladrilho: 10 simples, 10 duplos, 10 triplos. Foco fixo e cabeça chegando primeiro."],["Transferência de peso","Caminhe em câmera lenta 2 min pelo salão. O peso chega por completo antes de mover o outro pé."],["Footwork de salsa","Tap, Suzy-Q, cuban motion e joelhos flexíveis. Pratique cada um por 2 min em velocidades diferentes."],["Isolamentos","Cabeça, peito, quadris e ombros separadamente. É a base das ondas de bachata e dos shines limpos."],["Bachata: quadris e ondas","Círculos de quadril, oitos e rebotes. Onda corporal dos joelhos à cabeça sem mover os pés."],["Conexão de casal","Condução com tônus médio, nem rígido nem frouxo. Trabalhe tensão e compressão com seu parceiro, sem música."]]},{"n":"Palco","h":"Mobilidade no palco","p":"Mover-se bem pelo espaço e ter um corpo móvel dá presença e evita lesões.","t":"Ensaie no palco real ou em um espaço com as mesmas medidas. A distância muda tudo.","x":null,"i":[["Mapa do palco","Divida o espaço em 9 zonas. Atribua a cada frase da coreo uma zona diferente para preencher todo o espaço."],["Diagonais e trajetórias","As diagonais parecem maiores. Alterne linhas, círculos e zigue-zague para dar dinamismo."],["Níveis","Alto, médio e baixo em cada música. Uma mudança de nível justo na frase-chave gera impacto."],["Entradas e saídas","Ensaie só a entrada e a saída 10 vezes. São a primeira e a última coisa que o público lembra."],["Orientação ao público","Abra o peito para a plateia nos giros e nas poses. Pratique com uma câmera como público."],["Mobilidade articular","Rotina diária de 10 min: tornozelos, quadris (círculos 90/90), coluna (gato-camelo), ombros e pescoço."]]},{"n":"Força + elegância","h":"Combinar força energética e elegância","p":"Potência sem controle é barulho. Elegância sem energia é morna. A arte está no contraste.","t":"Força que se sente no chão, elegância que se vê no ar.","x":null,"i":[["Forte embaixo, suave em cima","Pés e pernas potentes, braços e pescoço longos e relaxados. Pratique uma frase assim."],["Ataque e soltura","Bata o passo com intenção (ataque) e solte em seguida. Parece potente sem rigidez."],["Mesma coreo, duas intensidades","Dance sua rotina a 100% e depois a 40% mantendo toda a qualidade. Você descobre onde está a elegância."],["Pescoço longo, olhar alto","Imagine um fio puxando o topo da cabeça. Mantenha a postura mesmo quando as pernas trabalham no máximo."],["Pausa com tensão","Congele 1 tempo depois de um movimento forte, com o corpo vivo. Essa pausa é pura elegância."],["Mãos e linhas","Termine cada movimento até a ponta dos dedos e dos pés. Os detalhes polem a força."]]},{"n":"Nuances","h":"Dançar com diferentes nuances","p":"Um mesmo passo pode contar cem coisas dependendo de como você dança.","t":"As nuances mantêm o público atento. Varie, mesmo que seja uma pequena diferença, a cada 8 tempos.","x":null,"i":[["Roda de qualidades","Dance 8 tempos como: staccato (cortado), legato (fluido), pesado, leve e vibrado. Alterne a cada 30 s."],["Roda de emoções","Alegria, nostalgia, sedução, raiva e humor sobre o mesmo passo. Muda seu rosto e o corpo todo."],["Tamanho e velocidade","Faça o movimento grande, médio e minúsculo. Depois em dobro e em metade do tempo."],["Bachata: sensual, moderna e dominicana","Pratique cada versão com a mes g("ss").onclick=()=>{if(!prem){openUnlock();return}const c=cur;sess(S()[c].i.map((_,j)=>[c,j]),false,()=>{S()[c].i.forEach((_,j)=>{if(P[c][j][1]>0)st[c+"-"+j]=true});sv();draw()})};
prog()}
function plan(){
const d=prem?pl.d:"3",gk=prem?pl.g:"bal",ui=L[lang].ui;
const dayOpts=["3","4","5","6"].map(v=>'<option value="'+v+'"'+(v==d?" selected":"")+">"+v+(!prem&&v!="3"?" 🔒":"")+"</option>").join("");
const goalOpts=Object.keys(ui.goals).map(v=>'<option value="'+v+'"'+(v==gk?" selected":"")+">"+ui.goals[v]+(!prem&&v!="bal"?" 🔒":"")+"</option>").join("");
const t=build(d,gk),w=W[d],DD=[];
let h='<div class="intro"><h2>'+U("planT")+"</h2><p>"+U("planI")+'</p></div><div class="form"><label>'+U("daysL")+'<select id="p1">'+dayOpts+"</select></label><label>"+U("goalL")+'<select id="p2">'+goalOpts+"</select></label></div>";
t.forEach((day,i)=>{const dn=ui.days[w[i]];
if(!prem&&i>0){h+='<div class="day lkd" data-u="1"><h3>'+dn+'</h3><div class="mut">'+day.map(([s])=>E[s]+" "+S()[s].n).join(" · ")+"</div><div>"+U("lockDay")+"</div></div>";DD[i]=null;return}
const L2=[];let hh="";
day.forEach(([s,r])=>{const it=S()[s].i,tl=it.map((_,j)=>j).filter(j=>P[s][j][1]>0);
hh+='<div class="sec">'+E[s]+" "+S()[s].n+(r?"<em>"+U("boost")+"</em>":"")+"</div>";
[0,1].forEach(k=>{const j=tl[(pl.s*2+k)%tl.length],key="p"+i+"-"+s+"-"+j;L2.push([s,j]);
hh+='<label class="ex"><input type="checkbox" data-k="'+key+'"'+(st[key]?" checked":"")+"><div><b>"+it[j][0]+"</b><small>"+it[j][1]+'</small><span class="rx">⏱ '+rx(s,j)+"</span></div></label>"})});
const tot=Math.round(qb(L2,true).reduce((a,b)=>a+b.s,0)/60);
h+='<div class="day"><h3>'+dn+" <small>· "+U("approx",{m:tot})+"</small></h3>"+hh+'<button class="go" data-d="'+i+'" style="width:100%;margin-top:10px">'+(prem?U("sessDay"):U("lockSess"))+"</button></div>";DD[i]=L2});
const rest=ui.days.filter((_,i)=>!w.includes(i));
h+='<div class="rest">'+U("restT",{d:rest.join(", ")})+'</div><button class="sm" id="vr">'+(prem?U("vary"):U("lockVary"))+"</button>";
main.innerHTML=h;
g("p1").onchange=e=>{if(!prem&&e.target.value!="3"){openUnlock();plan();return}pl.d=e.target.value;keep();plan()};
g("p2").onchange=e=>{if(!prem&&e.target.value!="bal"){openUnlock();plan();return}pl.g=e.target.value;keep();plan()};
g("vr").onclick=()=>{if(!prem){openUnlock();return}pl.s++;keep();plan()};
main.querySelectorAll(".ex input").forEach(i=>i.onchange=()=>{st[i.dataset.k]=i.checked;sv()});
main.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(!prem){openUnlock();return}const i=+b.dataset.d;sess(DD[i],true,()=>{DD[i].forEach(([s,j])=>{st["p"+i+"-"+s+"-"+j]=true});sv();plan()})})}

/* ---------- eventos e inicio ---------- */
const main=g("main");
document.addEventListener("click",e=>{
const l=e.target.closest("[data-l]");if(l){lang=l.dataset.l;ls.set("bp_lang",lang);draw();return}
if(e.target.closest("[data-u]")){e.preventDefault();openUnlock()}});
g("aib").onclick=()=>{cur=-1;draw();scrollTo(0,0)};
g("rst").onclick=()=>{st={};sv();draw()};
draw();
try{const c=new URLSearchParams(location.search).get("code");if(c)activate(c).then(r=>{if(r===true)draw()})}catch(e){}
if(true&&"serviceWorker" in navigator&&location.protocol.startsWith("http"))try{navigator.serviceWorker.register("sw.js")}catch(e){}

</script>
