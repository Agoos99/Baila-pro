{n:"Resistencia",e:"<svg width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-.15em'><path d='M12 3v8M12 11l-3 3M12 11l3 3'/><path d='M10 9C7 9 4 14 4 18c0 2 1.5 3 3 2.5 2-.5 3-2 3-4z'/><path d='M14 9c3 0 6 5 6 9 0 2-1.500 3-3 2.500-2-.5-3-2-3-4z'/></svg>",h:"Resistencia física",p:"Un show exige sostener intensidad alta durante varios minutos sin perder técnica.",

i:[["Curva de intensidad","En coreografía, los picos y valles son la dinámica, intensidad y estructura visual o emocional de la pieza. No puede mantenerse siempre en el mismo nivel: necesita relieve.",`🏔️ ¿Qué son los Picos?

Los picos son los momentos de máxima intensidad, energía o clímax dentro de la coreografía.
• En la energía: Movimientos explosivos, saltos, giros rápidos, acrobacias o secciones donde todo el grupo baila al unísono con mucha fuerza.
• En lo visual: Formaciones expandidas, niveles altos (bailarines de pie o cargadas/lifts) y movimientos muy acentuados que capturan por completo la atención del público.
• En la emoción: El punto de mayor tensión dramática o euforia de la historia que se está contando.

🪵 ¿Qué son los Valles?

Los valles son los momentos de calma, transición o baja intensidad que contrastan con los picos.
• En la energía: Movimientos lentos, fluidos, sutiles o pausas dramáticas (silencios de movimiento).
• En lo visual: Niveles bajos (bailarines en el suelo), formaciones agrupadas o compactas, o momentos donde solo un solista se mueve mientras el resto se mantiene estático.
• En la emoción: Momentos de introspección, tristeza, vulnerabilidad o preparación antes de la siguiente gran sección.

<b>¿Por qué son importantes en una coreografía?</b>
<div style="overflow-x:auto"><table><tr><th>Característica</th><th>Picos (Altos)</th><th>Valles (Bajos)</th></tr><tr><td>Función principal</td><td>Generar impacto, sorpresa y emoción.</td><td>Dar un «respiro» al espectador y al bailarín; construir tensión.</td></tr><tr><td>Niveles corporales</td><td>Saltos, cargadas, posiciones erguidas.</td><td>Trabajo de suelo, cuclillas, torsos inclinados.</td></tr><tr><td>Relación musical</td><td>Coinciden con el coro, el drop o acentos fuertes.</td><td>Coinciden con las estrofas, silencios o melodías suaves.</td></tr></table></div>
El secreto de una gran coreografía radica en el contraste. Sin los valles, los picos no se sentirían tan impactantes; y sin los picos, los valles harían que la coreografía se sintiera plana.`],
["Activación pre-escena","Ejercicios físicos, vocales y mentales justo antes de salir a escena, para conectar cuerpo, voz y emociones con lo que pide la escena.",`🎭 Rutina de Activación en 4 Pasos

1. Activación Física (Cuerpo)

El objetivo es liberar tensiones cotidianas y ganar presencia escénica.

• Sacudida corporal: Comienza sacudiendo las manos, los brazos, las piernas y todo el cuerpo para soltar el estrés acumulado.

• Estiramientos suaves: Rota los hombros, el cuello (en semicírculos) y la cadera para desbloquear las articulaciones.

• Activación de la energía: Realiza saltos pequeños en el lugar o camina a diferentes ritmos (del 1 al 7) para elevar el ritmo cardíaco y el estado de alerta.

2. Activación Vocal (Voz y Resonancia)

Prepara el aparato fonador para proyectar sin lastimarse y mejorar la dicción.

• Respiración diafragmática: Coloca una mano en el abdomen; inhala por la nariz inflando la panza y exhala lentamente con un sonido "Sssss".

• Masaje facial: Masajea la mandíbula y las mejillas para relajar los músculos de la masticación.

• Vocalización y resonadores: Emite el sonido "Mmmmm" (como imitando un motor) sintiendo la vibración en los labios, nariz y pecho. Luego, haz vibrar los labios ("Brrrr").

• Articulación: Exagera la gesticulación repitiendo trabalenguas cortos o las vocales (A-E-I-O-U) abriendo mucho la boca.

3. Activación Mental y Foco (Mente)

Ayuda a apagar el "ruido del día" y centrarse en el aquí y el ahora.

• Punto fijo o vacío: Cierra los ojos durante un minuto, concéntrate únicamente en tu respiración y limpia tu mente de pensamientos ajenos a la obra.

• Atención al entorno: Abre los ojos y observa tres objetos a tu alrededor en detalle para anclarte en el presente.

4. Conexión con la Escena (Personaje)

El puente directo hacia la ficción que vas a habitar.

• El "motor" del personaje: Camina por el espacio adoptando la postura corporal de tu personaje ( ¿Dónde lleva su peso?, ¿Cuál es su ritmo?).

• Repaso del objetivo: Pregúntate justo antes de entrar: ¿Qué quiero lograr en esta escena? y ¿Qué acabo de hacer justo antes de este momento? (el antecedente inmediato).`],

{n:"Mentalidad",e:"🧠",h:"Trabajos de mentalidad",p:"El cuerpo ejecuta lo que la cabeza le permite. Entrená la mente como entrenás las piernas.",
x:`Una rutina pre-escena es un conjunto de acciones físicas, mentales y vocales que realiza un actor justo antes de entrar a escena o filmar para estar completamente presente, disponible y conectado con la ficción. No existe una fórmula única, pero una estructura fija efectiva se divide en cuatro pilares secuenciales: cuerpo, voz, mente y conexión con el personaje.

A continuación, tienes una rutina fija estructurada de 15 a 20 minutos que puedes adaptar a tus necesidades:

<b>1. Preparación Física (Cuerpo) • 5 minutos</b>
El objetivo es liberar la tensión acumulada y activar la energía corporal.

• <b>Estiramiento general:</b> Estira brazos, piernas y espalda (vértebra por vértebra) para eliminar la rigidez del día.
• <b>Sacudida de tensión:</b> Sacude las manos, los pies y todo el cuerpo vigorosamente durante 30 segundos mientras exhalas con sonido.
• <b>Anclaje:</b> Quédate quieto, con los pies paralelos a la altura de las caderas, sintiendo el peso del cuerpo hacia el suelo.

<b>2. Activación Vocal (Voz) • 3 minutos</b>
Prepara el aparato fonador para que la voz responda a cualquier exigencia emocional sin lastimarte.

• <b>Respiración intercostal:</b> Coloca las manos en las costillas, inhala por la nariz expandiendo los costados y exhala lentamente con el sonido "Sssss".
• <b>Masaje facial:</b> Masajea la mandíbula (zona de la ATM), las mejillas y la frente para relajar los músculos de la expresión.
• <b>Vibración de labios:</b> Haz el sonido de un motor de coche con los labios ("Brrrrr") subiendo y bajando el tono (glissando).
• <b>Articulación:</b> Di un trabalenguas corto o exagera la gesticulación de las vocales (A, E, I, O, U) sin emitir sonido.

<b>3. Enfoque Mental (Mente) • 3 minutos</b>
Limpia la mente de tus problemas personales y del ruido del "backstage".

• <b>La regla del espacio:</b> Imagina un círculo a tu alrededor. Deja fuera de ese círculo todo lo que te haya pasado hoy (el tráfico, una discusión, el cansancio).
• <b>Atención al entorno:</b> Nombra mentalmente 3 cosas que ves a tu alrededor y 3 sonidos que escuchas en este momento. Esto te trae al presente exacto.

<b>4. Conexión con la Ficción (Personaje) • 4 minutos</b>
El paso final para entrar en la piel del personaje justo antes de que digan "acción" o salgas a escena.

• <b>El monólogo interior:</b> Piensa qué estaba haciendo el personaje un minuto antes de que empiece la escena. ¿De dónde viene? ¿Qué acaba de pasarle?
• <b>El objetivo inmediato:</b> Define en una sola frase qué quiere tu personaje en esta escena específica (ej: "Quiero que me pida perdón", "Quiero convencerlo de que no se vaya").
• <b>La primera línea:</b> Repasa mentalmente (o susurrando) tu primera frase del texto y la última del actor que te da el pie.`,

{n:"Fuerza muscular",e:"🔥",h:"Fuerza muscular y potencia en escena",p:"El estilo de baile se reconoce por la potencia, la velocidad de pies y la espectacularidad. Esto se construye con fuerza.",
